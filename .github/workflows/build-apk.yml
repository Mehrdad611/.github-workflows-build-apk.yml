name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP_FILE"


      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted


      - name: Find application directory
        run: |
          PACKAGE_FILE=$(find extracted -type f -name "package.json" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_FILE")

          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV
          echo "Application directory: $APP_DIR"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install dependencies
        run: |
          cd "$APP_DIR"

          npm install


      - name: Build web application
        run: |
          cd "$APP_DIR"

          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Looking for existing web files."
          fi


      - name: Prepare web assets
        run: |
          cd "$APP_DIR"

          rm -rf dist
          mkdir -p dist

          WEB_DIR=""

          for DIR in dist build www out; do
            if [ -f "$DIR/index.html" ]; then
              WEB_DIR="$DIR"
              break
            fi
          done

          if [ -z "$WEB_DIR" ]; then
            INDEX_FILE=$(find . \
              -path "./node_modules" -prune -o \
              -path "./android" -prune -o \
              -name "index.html" -type f -print | head -n 1)

            if [ -n "$INDEX_FILE" ]; then
              WEB_DIR=$(dirname "$INDEX_FILE")
            fi
          fi

          if [ -z "$WEB_DIR" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          echo "Web directory: $WEB_DIR"

          if [ "$WEB_DIR" != "dist" ]; then
            cp -R "$WEB_DIR"/. dist/
          fi

          echo "dist contents:"
          ls -la dist

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi


      - name: Create Capacitor configuration
        run: |
          cd "$APP_DIR"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.xauusd.historicaltrader",
            "appName": "XAUUSD Historical Trader",
            "webDir": "dist"
          }
          EOF


      - name: Install Capacitor
        run: |
          cd "$APP_DIR"

          npm install @capacitor/core @capacitor/cli @capacitor/android


      - name: Add Android
        run: |
          cd "$APP_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists"
          fi


      - name: Sync Android
        run: |
          cd "$APP_DIR"

          npx cap sync android


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Build APK
        run: |
          cd "$APP_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Historical-Trader-APK
          path: |
            **/android/app/build/outputs/apk/debug/*.apk
